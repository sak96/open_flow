[project]
name = "open-flow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "evdev>=1.9.2",
    "openai>=2.6.1",
    "pillow>=12.0.0",
    "pynput>=1.8.1",
    "pyscreenshot>=3.1",
    "pywinctl>=0.4.1",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "ruff>=0.14.2",
    "types-pillow>=10.2.0.20240822",
    "types-pynput>=1.8.1.20250809",
]

[project.scripts]
open_flow = "open_flow:cli"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.ruff.lint]
extend-select = ["I"]
